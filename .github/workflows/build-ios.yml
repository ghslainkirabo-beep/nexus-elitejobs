name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-pwa/package-lock.json

      - name: Verify Node Version
        run: node -v

      - name: Install Dependencies & Build Web Assets
        run: |
          cd frontend-pwa
          npm install
          npm run build

      - name: Clean, Add Capacitor iOS, and Sync
        run: |
          cd frontend-pwa
          npm install @capacitor/ios
          rm -rf ios
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Workspace
        run: |
          cd frontend-pwa/ios/App
          ls -la
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO