name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies & Build Web Assets
        run: |
          cd frontend-pwa
          npm install
          npm run build

      - name: Initialize Capacitor iOS
        run: |
          cd frontend-pwa
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Workspace
        run: |
          cd frontend-pwa/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO